<ol class="timeline">
  @for (company of companies; track company.name) {
    <li [style.--logo-scale]="company.scale ?? 1">
      <button
        #logo
        type="button"
        [class.active]="open()?.logo === logo"
        [attr.aria-expanded]="open()?.company === company"
        aria-controls="work-card"
        (mouseenter)="show(company, logo)"
        (click)="show(company, logo)"
        (focus)="show(company, logo)"
      >
        <span class="mark"><img [src]="company.logo" [alt]="company.name" loading="lazy" /></span>
        <span class="dot" aria-hidden="true"></span>
        <span class="years">{{ company.years }}</span>
      </button>
    </li>
  }
</ol>

@if (open(); as card) {
  <div id="work-card" class="card" role="region" [attr.aria-label]="card.company.name" [style.top.px]="card.top" [style.left.px]="card.left" [style.--arrow.px]="card.arrow">
    <h4>{{ card.company.name }}</h4>
    @if (card.company.note) {
      <p class="note">{{ card.company.note }}</p>
    }
    <ul class="roles">
      @for (role of card.company.roles; track role.title) {
        <li><strong>{{ role.title }}</strong> <span>{{ role.dates }}</span></li>
      }
    </ul>
  </div>
}
