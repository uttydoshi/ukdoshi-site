@for (layout of [wide(), narrow()]; track $index; let li = $index) {
  <svg
    [class]="li === 0 ? 'wide' : 'narrow'"
    [attr.viewBox]="'0 0 ' + layout.width + ' ' + layout.height"
    role="group"
    [attr.aria-label]="label()"
  >
    <defs>
      <marker [attr.id]="arrowId + '-' + li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
      </marker>
    </defs>

    @for (group of layout.groups; track group.label) {
      <g class="group" [class.aws]="group.style === 'aws'">
        <rect [attr.x]="group.x" [attr.y]="group.y" [attr.width]="group.width" [attr.height]="group.height" />
        <image [attr.href]="group.icon" [attr.x]="group.x" [attr.y]="group.y" width="26" height="26" />
        <text [attr.x]="group.x + 32" [attr.y]="group.y + 17">{{ group.label }}</text>
      </g>
    }

    @for (edge of layout.edges; track $index) {
      <path class="edge" [class.dashed]="edge.dashed" [attr.d]="edge.d" [attr.marker-end]="'url(#' + arrowId + '-' + li + ')'" />
      @if (edge.label; as label) {
        <text class="edge-label" [attr.x]="label.x" [attr.y]="label.y" [attr.text-anchor]="label.anchor ?? 'middle'">
          {{ label.text }}
        </text>
      }
    }

    @for (node of nodes(); track node.id) {
      @if (layout.boxes[node.id]; as at) {
        <g
          class="node"
          [class.selected]="selected() === node.id"
          tabindex="0"
          role="button"
          [attr.aria-label]="node.label + ': ' + node.why"
          (mouseenter)="selected.set(node.id)"
          (focus)="selected.set(node.id)"
          (click)="selected.set(node.id)"
        >
          <rect class="hit" [attr.x]="at.x" [attr.y]="at.y - 6" [attr.width]="box.width" [attr.height]="box.height + 6" rx="10" />
          <image
            [attr.href]="node.icon"
            [attr.x]="at.x + (box.width - box.icon) / 2"
            [attr.y]="at.y"
            [attr.width]="box.icon"
            [attr.height]="box.icon"
          />
          <text class="node-label" [attr.x]="at.x + box.width / 2" [attr.y]="at.y + 68">{{ node.label }}</text>
          <text class="node-sub" [attr.x]="at.x + box.width / 2" [attr.y]="at.y + 84">{{ node.sub }}</text>
        </g>
      }
    }
  </svg>
}

<p class="explanation" aria-live="polite">
  @if (explanation(); as node) {
    <strong>{{ node.label }}:</strong> {{ node.why }}
  } @else {
    Hover over or tap an icon to see why it's there.
  }
</p>
