name: Deploy

# Every push tests, builds and deploys: staging -> staging.ukdoshi.com, main -> ukdoshi.com.
# "Run workflow" on the Actions tab redeploys a branch by hand.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# One deploy per site at a time; a newer push waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # lets the job log in to AWS via OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - name: Build frontend
        working-directory: frontend
        # The commit and time show in the staging footer, so testers can say which version they saw.
        run: |
          npm ci
          npm run build -- --define "BUILD_COMMIT='${GITHUB_SHA::7}'" --define "BUILD_TIME='$(date -u +%Y-%m-%dT%H:%M:%SZ)'"

      - name: Install CDK
        working-directory: infra
        run: |
          npm install -g aws-cdk@2.1146.1
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::652284808153:role/ukdoshi-github-deploy
          aws-region: us-east-1

      - name: Deploy ukdoshi.com
        if: github.ref_name == 'main'
        working-directory: infra
        run: cdk deploy UkdoshiDns UkdoshiAuth UkdoshiSite --require-approval never

      # --exclusively: staging only reads the shared DNS zone; changes to it ship with main.
      - name: Deploy staging.ukdoshi.com
        if: github.ref_name == 'staging'
        working-directory: infra
        run: cdk deploy UkdoshiStagingAuth UkdoshiStagingSite --exclusively --require-approval never
