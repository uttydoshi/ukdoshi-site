name: Deploy

# Every push tests (backend and frontend), builds and deploys: staging -> staging.ukdoshi.com, main -> ukdoshi.com.
# "Run workflow" on the Actions tab redeploys a branch by hand.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# One deploy per site at a time; a newer push waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # lets the job log in to AWS via OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"
          # Reuse downloaded Python packages between runs instead of fetching them from PyPI every time.
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            infra/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        # The commit and time show in the staging footer, so testers can say which version they saw.
        run: |
          npm run build -- --define "BUILD_COMMIT='${GITHUB_SHA::7}'" --define "BUILD_TIME='$(date -u +%Y-%m-%dT%H:%M:%SZ)'"

      # The CDK tools are a big download, and fetching them sometimes took 5-8 minutes. Keep them between
      # runs: the CLI until its version changes, the Python environment until requirements.txt or Python does.
      - name: Restore CDK CLI
        id: cdk-cli
        uses: actions/cache@v4
        with:
          path: ~/.cdk-cli
          key: cdk-cli-2.1146.1-node24

      - name: Restore CDK Python environment
        id: cdk-venv
        uses: actions/cache@v4
        with:
          path: infra/.venv
          key: cdk-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('infra/requirements.txt') }}

      - name: Install CDK
        working-directory: infra
        run: |
          if [ "${{ steps.cdk-cli.outputs.cache-hit }}" != "true" ]; then
            npm install --prefix ~/.cdk-cli aws-cdk@2.1146.1
          fi
          echo "$HOME/.cdk-cli/node_modules/.bin" >> "$GITHUB_PATH"
          if [ "${{ steps.cdk-venv.outputs.cache-hit }}" != "true" ]; then
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::652284808153:role/ukdoshi-github-deploy
          aws-region: us-east-1

      - name: Deploy ukdoshi.com
        if: github.ref_name == 'main'
        working-directory: infra
        run: cdk deploy UkdoshiDns UkdoshiAuth UkdoshiSite --require-approval never

      # --exclusively: staging only reads the shared DNS zone; changes to it ship with main.
      - name: Deploy staging.ukdoshi.com
        if: github.ref_name == 'staging'
        working-directory: infra
        run: cdk deploy UkdoshiStagingAuth UkdoshiStagingSite --exclusively --require-approval never
